services:
  # Serviço para o Backend (Node.js)
  - type: web
    name: backend-academia
    env: node
    region: oregon # ou a região de sua preferência
    rootDir: backend
    plan: free # ou o plano de sua preferência
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Serviço para o Frontend (Site Estático)
  - type: static
    name: frontend-academia
    region: oregon # ou a região de sua preferência
    rootDir: frontend
    plan: free # ou o plano de sua preferência
    # Nenhum comando de build é necessário para este site estático simples
    buildCommand: ""
    # O diretório 'frontend' será servido como conteúdo estático
    staticPublishPath: .
    routes:
      # Redireciona chamadas /api/* para o backend
      - type: rewrite
        source: /api/*
        destination: https://backend-academia.onrender.com/api/*
      # Trata o roteamento do lado do cliente para a SPA
      - type: rewrite
        source: /*
        destination: /index.html
